<!doctype html>
<html xmlns="http://www.w3.org/1999/xhtml" class="is-smooth-scroll-compatible is-loading">
  <head>
    <!-- 렌더 게이트: 매핑 전 placeholder/fallback 깜빡임 방지 (매핑 완료 시 페이드인) -->
    <style>html.tpl-loading body{opacity:0}body{opacity:1;transition:opacity .3s ease}</style>
    <script>document.documentElement.classList.add('tpl-loading');window.__tplReveal=function(){document.documentElement.classList.remove('tpl-loading');};setTimeout(function(){window.__tplReveal&&window.__tplReveal();},3000);</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title data-page-title>포항 연오랑파크 풀빌라</title>
    <link rel="icon" href="data:," />
    <!-- SEO: homepage.seo → preview-handler.applySeo()가 title/description/keywords/og 동적 주입 (하드코딩 없음) -->
    <meta property="og:type" content="website" />
    <link rel="stylesheet" type="text/css" href="styles/reset.css" />
    <link rel="stylesheet" type="text/css" href="styles/theme.css" />
    <link rel="stylesheet" type="text/css" href="styles/style.css" />
    <link rel="stylesheet" type="text/css" href="styles/vendor/swiper-bundle.min.css" />

    <script src="js/gsap.min.js"></script>
    <script src="js/ScrollTrigger.min.js"></script>
    <script type="text/javascript" src="js/swiper-bundle.min.js"></script>
    <script type="text/javascript" src="js/locomotive-scroll.min.js"></script>

    <script nomodule="" src="js/polyfill.min.js" crossorigin="anonymous"></script>
    <script
      nomodule=""
      src="https://polyfill.io/v3/polyfill.min.js?features=Object.assign%2CElement.prototype.append%2CNodeList.prototype.forEach%2CCustomEvent%2Csmoothscroll"
      crossorigin="anonymous"
    ></script>
    <!-- Open Graph Meta Tags for Social Media -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="포항 연오랑파크 풀빌라" />
  <meta property="og:description" content="포항 연오랑파크 풀빌라에서 따뜻한 온수수영장과 프라이빗 독채, 개별바베큐를 즐기며 가족·커플을 위한 감성 가득한 힐링 여행을 경험해보세요." />
  <meta property="og:image" content="https://bookingplay-media.s3.amazonaws.com/item_images/2026/08/06/cTw2dRzOBqPp.jpg" />
  <meta property="og:url" content="https://yeonolangpark.kr" />

  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="포항 연오랑파크 풀빌라" />
  <meta name="twitter:description" content="포항 연오랑파크 풀빌라에서 따뜻한 온수수영장과 프라이빗 독채, 개별바베큐를 즐기며 가족·커플을 위한 감성 가득한 힐링 여행을 경험해보세요." />
  <meta name="twitter:image" content="https://bookingplay-media.s3.amazonaws.com/item_images/2026/08/06/cTw2dRzOBqPp.jpg" />
  <meta name="naver-site-verification" content="853727eb19358bf42dcb670f44c7609b4c606e91" />
  <meta name="google-site-verification" content="alH5mOMJKNmCvtyfRiRI78gI2qA293hcGFrhZhpcANw" />
</head>
  <body>
    <div id="wrap">
      <div id="header-wrap"></div>

      <div class="scroll-wrap" id="doc" data-scroll-container="">
        <div id="container" class="fadeDown" data-scroll="">
          <!-- s: sub_visual -->
          <div class="sub_visual visual">
            <div class="visual_box">
              <div class="swiper-container svisual">
                <!-- data-* : data-layout-map-hero-slides | customFields.pages.layoutMap.sections[0].hero.images[isSelected] (배경 슬라이드 동적 생성) -->
                <div class="swiper-wrapper" data-layout-map-hero-slides>
                  <!-- MAPPER: hero.images 기준 .swiper-slide>.img(background) 동적 생성 -->
                </div>
              </div>
            </div>
          </div>
          <div id="snb_wrap">
            <!-- data-* : data-room-list-nav | customFields.roomtypes[] (룸 미리보기 제외하고 동적 생성, room.html?room_id={id}) -->
            <ul data-room-list-nav>
              <li class="active"><a href="layout-map.html">미리보기</a></li>
              <!-- MAPPER: roomtypes[] 기준 <li><a href="room.html?room_id={id}">{name}</a></li> 동적 생성 -->
            </ul>
          </div>
          <!-- data-* : data-layout-map-image | customFields.pages.layoutMap.sections[0].about.images[isSelected][0].url (배치도 이미지, 없으면 empty placeholder) -->
          <div class="wide_img inner">
            <img alt="" data-layout-map-image />
          </div>
          <div class="main_room" style="background: color-mix(in srgb, var(--color-primary) 55%, transparent)">
            <div class="cont fadeUp" data-scroll="">
              <h3>ROOM PREVIEW</h3>
              <div class="preivew fadeUp" data-scroll="">
                <div class="swiper-container">
                  <!-- data-* : data-room-list-slides | customFields.roomtypes[] (+ rooms[] id매칭 구조). 컨테이너 비우고 동적 생성, room.html?room_id={id} -->
                  <div class="swiper-wrapper" data-room-list-slides>
                    <!-- MAPPER: roomtypes[] 기준 .swiper-slide.item > a(room.html?room_id={id}, .custom_mousemove) > .img + .txt 동적 생성 -->
                  </div>
                  <div class="swiper-pagination"></div>
                </div>
                <a
                  href="#n"
                  class="room-prev"
                  style="background-image: url(images/special_prev.webp)"
                ></a>
                <a
                  href="#n"
                  class="room-next"
                  style="background-image: url(images/special_next.webp)"
                ></a>
              </div>
            </div>
          </div>
        </div>
        <div id="footer-wrap"></div>
      </div>
    </div>

    <!-- infra: 데이터 매핑 & 동적 헤더/푸터 -->
    <script src="js/image-helpers.js"></script>
    <script src="js/preview-handler.js"></script>
    <script src="js/data-mapper/core/base-mapper.js"></script>
    <script src="js/data-mapper/pages/header-footer-mapper.js"></script>
    <script src="js/data-mapper/pages/layout-map-mapper.js"></script>
    <script src="js/header-footer-loader.js"></script>
    <!-- 페이지 인터랙션 (vanilla) -->
    <script src="js/common.js"></script>
    <script src="js/custom.js"></script>
  </body>
</html>
